name: Publish to npm

# Publishing a GitHub Release (tag vX.Y.Z) publishes that version to npm. npm trusts this workflow
# through trusted publishing, so no npm token is stored, and npm adds provenance to the release.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify that this workflow run is the trusted publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11.5.1+, which trusted publishing needs
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the typecheck, the tests and the build first.
      - run: npm publish --access public
